name: build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: nodecook-agent-x86_64-unknown-linux-musl
            docker: messense/rust-musl-cross:x86_64-musl
          - target: aarch64-unknown-linux-musl
            asset: nodecook-agent-aarch64-unknown-linux-musl
            docker: messense/rust-musl-cross:aarch64-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image.tar
          key: docker-${{ matrix.docker }}-v1

      - name: Load or pull Docker image
        run: |
          if [ -f /tmp/docker-image.tar ]; then
            docker load -i /tmp/docker-image.tar
          else
            docker pull ${{ matrix.docker }}
            docker save ${{ matrix.docker }} -o /tmp/docker-image.tar
          fi

      - name: Build Linux binary
        run: |
          docker run --rm \
            -v "$PWD":/home/rust/src \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            ${{ matrix.docker }} \
            cargo build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p "dist/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/nodecook-agent" "dist/${{ matrix.asset }}/nodecook-agent"
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          sha256sum "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Cache mc binary
        id: mc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/mc
          key: mc-binary-linux-amd64-v1

      - name: Install mc
        if: steps.mc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o ~/.local/bin/mc
          chmod +x ~/.local/bin/mc

      - name: Upload to MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          ~/.local/bin/mc alias set s3 "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          ~/.local/bin/mc cp "dist/${{ matrix.asset }}.tar.gz" "s3/nodecook/${{ matrix.asset }}.tar.gz"
          ~/.local/bin/mc cp "dist/${{ matrix.asset }}.tar.gz.sha256" "s3/nodecook/${{ matrix.asset }}.tar.gz.sha256"
