name: build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: nodecook-agent-x86_64-unknown-linux-musl
            builder_image: messense/rust-musl-cross:x86_64-musl
          - target: aarch64-unknown-linux-musl
            asset: nodecook-agent-aarch64-unknown-linux-musl
            builder_image: messense/rust-musl-cross:aarch64-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: output
          build-args: |
            BUILDER_IMAGE=${{ matrix.builder_image }}
            TARGET=${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          outputs: type=local,dest=build-out

      - name: Package binary
        run: |
          mkdir -p "dist/${{ matrix.asset }}"
          cp build-out/nodecook-agent "dist/${{ matrix.asset }}/nodecook-agent"
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          sha256sum "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"

      - name: Cache mc binary
        id: mc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/mc
          key: mc-binary-linux-amd64-v1

      - name: Install mc
        if: steps.mc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o ~/.local/bin/mc
          chmod +x ~/.local/bin/mc

      - name: Upload to MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          ~/.local/bin/mc alias set s3 "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          ~/.local/bin/mc cp "dist/${{ matrix.asset }}.tar.gz" "s3/nodecook/${{ matrix.asset }}.tar.gz"
          ~/.local/bin/mc cp "dist/${{ matrix.asset }}.tar.gz.sha256" "s3/nodecook/${{ matrix.asset }}.tar.gz.sha256"
